# main에 bff/가 바뀌어 push되면 BFF 이미지를 빌드해 GHCR에 올려요. 서버 배포는 EC2에서
# 백엔드 레포의 deploy.sh로 해요(`./deploy.sh bff`). 이미지 이름은 백엔드 deploy/compose.prod.yml과 같아야 해요 (ADR-0008)
name: BFF Image

on:
  push:
    branches: [main]
    paths:
      - bff/**
      # Dockerfile이 루트의 이 파일들도 복사해요
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/bff-image.yml
  workflow_dispatch:

# 한 번에 하나만 실행해 늦게 시작한 빌드가 먼저 끝나 latest가 이전 커밋 이미지로 덮이지 않게 해요.
# 대기 중인 실행은 하나만 남아서, 연달아 push하면 중간 커밋의 SHA 태그는 생기지 않을 수 있어요
concurrency:
  group: bff-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/prgrms-be-adv-devcourse/paldo-gotgan-bff

jobs:
  build:
    # 수동 실행에서 다른 브랜치를 고르면 배포 대상이 아닌 코드가 latest가 되므로 main만 빌드해요
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 빌드가 멈추면 concurrency 대기열 전체가 막히므로 시간을 제한해요
    timeout-minutes: 20
    # 패키지 쓰기 권한은 이 워크플로에만 줘요
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 롤백할 때 백엔드 deploy/.env의 BFF_IMAGE_TAG에 넣는 값이에요
      - name: 커밋 SHA 7자리
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 컨텍스트는 저장소 루트예요(workspace lockfile이 루트에 있어요)
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bff/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=bff
          cache-to: type=gha,mode=max,scope=bff
