name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      target:
        description: 배포 대상
        type: choice
        options: [preview, production]
        default: preview

# 같은 브랜치의 배포가 겹치면 이전 것을 취소해요
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 수동 실행에서 고른 브랜치를 체크아웃하고, production을 고르면 프로덕션에 배포해요
    env:
      IS_PROD: ${{ inputs.target == 'production' }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        # 버전은 package.json의 packageManager를 따라요

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ env.IS_PROD == 'true' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ env.IS_PROD == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ env.IS_PROD == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 배포 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "- 대상: ${{ env.IS_PROD == 'true' && 'production' || 'preview' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 브랜치: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $url" >> "$GITHUB_STEP_SUMMARY"
